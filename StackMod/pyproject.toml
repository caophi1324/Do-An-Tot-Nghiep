[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "db*", "service*", "ui*", "tools*"]

[project]
name = "ai-face-tracking-studio"
version = "2.0.0"
description = "AI Face Recognition & Object Tracking System with OBS Studio UI and FastAPI headless service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uniface>=4.0.0",
    "faiss-cpu>=1.7.4",
    "ultralytics>=8.0.0",
    "pyside6>=6.5.0",
    "opencv-python>=4.8.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.18",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-timeout>=2.1.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
face-studio = "ui.main:main"
face-service = "service.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: nạp model thật",
    "ui: cần Qt offscreen",
]
addopts = "-ra"
timeout = 60
faulthandler_timeout = 30
